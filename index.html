<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MeowApp">
    <title>MeowApp 🐱</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            min-height: 100dvh;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5ea;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 { font-size: 20px; font-weight: 700; }

        .btn-gear {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 20px 16px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Photo area */
        .photo-area {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #8e8e93;
            padding: 40px;
            text-align: center;
        }

        .photo-placeholder .icon { font-size: 64px; line-height: 1; }
        .photo-placeholder p { font-size: 15px; line-height: 1.4; }

        #preview {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: none;
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            text-decoration: none;
        }

        .btn:active { opacity: 0.75; }
        .btn:disabled { background: #c7c7cc !important; cursor: not-allowed; }

        .btn-orange { background: #ff9500; color: white; }
        .btn-green  { background: #34c759; color: white; }
        .btn-gray   { background: #8e8e93; color: white; }
        .btn-outline { background: white; color: #ff9500; border: 2px solid #ff9500; }

        #fileInput { display: none; }

        /* Error */
        .error {
            background: #fff0f0;
            border: 1px solid #ffcdd2;
            border-radius: 12px;
            padding: 14px 16px;
            color: #c62828;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
        .error.visible { display: block; }

        /* Results */
        .results { display: none; flex-direction: column; gap: 12px; }
        .results.visible { display: flex; }

        .card { background: white; border-radius: 16px; overflow: hidden; }

        .card-header {
            padding: 14px 16px 6px;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .summary-body { padding: 6px 16px 16px; }

        .meal-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; }

        .total-row { display: flex; justify-content: space-between; align-items: center; }
        .total-label { color: #8e8e93; font-size: 15px; }
        .total-kcal { font-size: 24px; font-weight: 700; color: #ff9500; }

        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid #f2f2f7;
        }

        .ingredient-left { flex: 1; min-width: 0; }
        .ingredient-name { font-size: 16px; font-weight: 500; }
        .ingredient-qty { font-size: 13px; color: #8e8e93; margin-top: 2px; }
        .ingredient-kcal { font-size: 15px; font-weight: 600; color: #34c759; margin-left: 12px; white-space: nowrap; }

        .notes-body { padding: 6px 16px 16px; color: #636366; font-size: 15px; line-height: 1.5; }

        /* Spinner */
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Settings modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.visible { display: flex; }

        .modal {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            padding: 24px 20px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .modal input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e5e5ea;
            border-radius: 12px;
            font-size: 15px;
            font-family: monospace;
            outline: none;
            margin-bottom: 8px;
            background: #f9f9f9;
        }
        .modal input:focus { border-color: #ff9500; background: white; }

        .hint { font-size: 13px; color: #8e8e93; margin-bottom: 20px; line-height: 1.4; }

        .modal-btns { display: flex; gap: 10px; }
        .modal-btns .btn { flex: 1; padding: 14px; }

        .btn-cancel { background: #f2f2f7; color: #1c1c1e; }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .api-badge.ok  { background: #e8f8ed; color: #1a7a3c; }
        .api-badge.nok { background: #ffebeb; color: #c0392b; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>MeowApp 🐱</h1>
        <button class="btn-gear" onclick="openSettings()" aria-label="Impostazioni">⚙️</button>
    </div>

    <div class="content">
        <div class="photo-area" onclick="triggerPicker()" id="photoArea">
            <div class="photo-placeholder" id="placeholder">
                <span class="icon">🍽️</span>
                <p>Tocca per scattare o scegliere una foto del tuo pasto</p>
            </div>
            <img id="preview" alt="Anteprima pasto">
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">

        <button class="btn btn-orange" onclick="triggerPicker()" id="btnPhoto">
            📷&nbsp; Scegli Foto
        </button>

        <button class="btn btn-green" onclick="analyze()" id="btnAnalyze" style="display:none">
            ✨&nbsp; Calcola Calorie
        </button>

        <div class="error" id="errorBox"></div>

        <div class="results" id="results"></div>

        <button class="btn btn-outline" onclick="resetApp()" id="btnReset" style="display:none">
            🔄&nbsp; Nuova Analisi
        </button>
    </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal" onclick="handleOverlayClick(event)">
    <div class="modal">
        <div class="modal-title">⚙️ Impostazioni</div>
        <div id="apiBadge"></div>
        <label class="field-label">Chiave API Claude</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <p class="hint">Crea la tua chiave su <strong>console.anthropic.com</strong> → API Keys.<br>Viene salvata solo sul tuo dispositivo.</p>
        <div class="modal-btns">
            <button class="btn btn-cancel" onclick="closeSettings()">Annulla</button>
            <button class="btn btn-orange" onclick="saveSettings()">Salva</button>
        </div>
    </div>
</div>

<script>
    let imgBase64 = null;
    let imgMime = 'image/jpeg';

    function triggerPicker() {
        document.getElementById('fileInput').click();
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        imgMime = file.type || 'image/jpeg';

        const reader = new FileReader();
        reader.onload = ev => {
            const dataUrl = ev.target.result;
            imgBase64 = dataUrl.split(',')[1];

            const preview = document.getElementById('preview');
            preview.src = dataUrl;
            preview.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';

            document.getElementById('btnAnalyze').style.display = 'flex';
            document.getElementById('results').classList.remove('visible');
            document.getElementById('results').innerHTML = '';
            document.getElementById('btnReset').style.display = 'none';
            hideError();
        };
        reader.readAsDataURL(file);
    }

    async function analyze() {
        const apiKey = localStorage.getItem('claude_api_key') || '';
        if (!apiKey) { showError('Chiave API mancante. Tocca ⚙️ per configurarla.'); openSettings(); return; }
        if (!imgBase64) { showError('Seleziona prima una foto.'); return; }

        const btn = document.getElementById('btnAnalyze');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Analisi in corso...';
        btn.className = 'btn btn-gray';
        hideError();

        try {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: 'claude-opus-4-8',
                    max_tokens: 1024,
                    messages: [{
                        role: 'user',
                        content: [
                            { type: 'image', source: { type: 'base64', media_type: imgMime, data: imgBase64 } },
                            { type: 'text', text: `Analizza questa immagine di un pasto e fornisci una lista dettagliata di tutti gli ingredienti visibili con le loro calorie stimate.

Rispondi SOLO con un oggetto JSON valido, senza testo aggiuntivo, nel seguente formato:
{
    "mealName": "Nome del pasto in italiano",
    "totalCalories": 500,
    "ingredients": [
        { "name": "Nome ingrediente", "quantity": "Quantità stimata", "calories": 200 }
    ],
    "notes": "Note nutrizionali opzionali"
}

Tutti i valori calorici devono essere numeri interi.` }
                        ]
                    }]
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error?.message || `Errore HTTP ${res.status}`);
            }

            const data = await res.json();
            const text = data.content?.find(b => b.type === 'text')?.text || '';
            showResults(parseJSON(text));

        } catch (err) {
            showError('Errore: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '✨&nbsp; Calcola Calorie';
            btn.className = 'btn btn-green';
        }
    }

    function parseJSON(text) {
        let s = text.trim();
        if (s.startsWith('```json')) s = s.slice(7);
        else if (s.startsWith('```')) s = s.slice(3);
        if (s.endsWith('```')) s = s.slice(0, -3);
        s = s.trim();
        const a = s.indexOf('{'), b = s.lastIndexOf('}');
        if (a !== -1 && b !== -1) s = s.slice(a, b + 1);
        return JSON.parse(s);
    }

    function showResults(a) {
        const el = document.getElementById('results');
        let html = `
        <div class="card">
            <div class="card-header">Riepilogo</div>
            <div class="summary-body">
                <div class="meal-name">${esc(a.mealName)}</div>
                <div class="total-row">
                    <span class="total-label">Totale calorie</span>
                    <span class="total-kcal">${a.totalCalories} kcal</span>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">Ingredienti (${a.ingredients.length})</div>
            ${a.ingredients.map(i => `
            <div class="ingredient-row">
                <div class="ingredient-left">
                    <div class="ingredient-name">${esc(i.name)}</div>
                    <div class="ingredient-qty">${esc(i.quantity)}</div>
                </div>
                <div class="ingredient-kcal">${i.calories} kcal</div>
            </div>`).join('')}
        </div>`;

        if (a.notes) html += `
        <div class="card">
            <div class="card-header">Note Nutrizionali</div>
            <div class="notes-body">${esc(a.notes)}</div>
        </div>`;

        el.innerHTML = html;
        el.classList.add('visible');
        document.getElementById('btnAnalyze').style.display = 'none';
        document.getElementById('btnReset').style.display = 'flex';
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    }

    function resetApp() {
        imgBase64 = null;
        document.getElementById('preview').style.display = 'none';
        document.getElementById('preview').src = '';
        document.getElementById('placeholder').style.display = 'flex';
        document.getElementById('btnAnalyze').style.display = 'none';
        document.getElementById('btnReset').style.display = 'none';
        document.getElementById('results').classList.remove('visible');
        document.getElementById('results').innerHTML = '';
        document.getElementById('fileInput').value = '';
        hideError();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showError(msg) {
        const el = document.getElementById('errorBox');
        el.textContent = msg;
        el.classList.add('visible');
    }
    function hideError() { document.getElementById('errorBox').classList.remove('visible'); }

    function openSettings() {
        const key = localStorage.getItem('claude_api_key') || '';
        document.getElementById('apiKeyInput').value = key;
        document.getElementById('apiBadge').innerHTML = key
            ? '<div class="api-badge ok">✅ Chiave configurata</div>'
            : '<div class="api-badge nok">❌ Chiave non impostata</div>';
        document.getElementById('settingsModal').classList.add('visible');
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('visible');
    }

    function saveSettings() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key) localStorage.setItem('claude_api_key', key);
        else localStorage.removeItem('claude_api_key');
        closeSettings();
    }

    function handleOverlayClick(e) {
        if (e.target === document.getElementById('settingsModal')) closeSettings();
    }

    function esc(s) {
        return String(s ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Auto-open settings if no key
    window.addEventListener('load', () => {
        if (!localStorage.getItem('claude_api_key')) setTimeout(openSettings, 600);
    });
</script>
</body>
</html>
